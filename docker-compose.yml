services:
    backend:
      build:
        context: .
        dockerfile: Dockerfile
      ports:
        - "8080:8080"
    
    nginx:
      image: nginx:latest
      container_name: nginx_proxy
      ports:
        - "80:80"
      volumes:
        - .nginx.conf:/etc/nginx/nginx.conf:ro
      depends_on:
        - backend
      
